name: 功能建议
description: 提出新的播放能力、交互改进或设置项。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的建议通常从「具体场景」出发，而不是从「加一个按钮」出发。请先描述你遇到的情况，再给出你设想的方案。

        > 一个 issue 只讨论一个建议；多个想法请分别提交。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下觉得现有做法不够用？
      placeholder: |
        例如：我经常在整理大量无损音频时，需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 描述你设想的操作方式或最终效果，不必详细到实现层面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 如果存在其他能解决同样问题的做法，也请写在这里。
  - type: dropdown
    id: importance
    attributes:
      label: 对你的重要程度
      options:
        - 有了更好
        - 明显提升使用体验
        - 当前功能缺失导致无法正常使用
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues 与更新日志，确认还没有相同或相近的建议。
          required: true
        - label: 我理解建议会按实际价值与实现成本排期，不保证一定实现。
          required: true
